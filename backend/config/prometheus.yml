# Prometheus configuration -- SupportMesh customer-service system

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'supportmesh'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # SupportMesh application metrics
  - job_name: 'supportmesh-app'
    static_configs:
      - targets: ['supportmesh:8000']
        labels:
          service: 'supportmesh'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
